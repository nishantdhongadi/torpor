<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Torpor</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16161a;
        --muted: #6b6b76;
        --line: #e6e6ea;
        --accent: #4a5568;
        --dormant: #7c8ba1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1f;
          --fg: #ededf0;
          --muted: #9a9aa5;
          --line: #2e2e33;
          --accent: #c8cfda;
          --dormant: #8d9db5;
        }
      }

      body {
        margin: 0;
        width: 268px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
      }

      .counts {
        display: flex;
        gap: 18px;
        padding: 16px 16px 14px;
        border-bottom: 1px solid var(--line);
      }
      .count {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .count b {
        font-size: 22px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      .count span {
        font-size: 11px;
        color: var(--muted);
      }
      .count.dormant b {
        color: var(--dormant);
      }

      #note {
        padding: 10px 16px;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }

      .actions {
        display: flex;
        flex-direction: column;
        padding: 6px;
        gap: 1px;
      }
      button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--fg);
        font: inherit;
        text-align: left;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      button:disabled {
        color: var(--muted);
        cursor: default;
      }
      button small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      footer a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="counts">
      <div class="count">
        <b id="loaded">–</b>
        <span>in memory</span>
      </div>
      <div class="count dormant">
        <b id="dormant">–</b>
        <span>dormant</span>
      </div>
      <div class="count">
        <b id="total">–</b>
        <span>tabs kept</span>
      </div>
    </div>

    <p id="note"></p>

    <div class="actions">
      <button id="sweep">Unload idle tabs now<small id="sweep-hint"></small></button>
      <button id="protect">Never unload this site<small id="protect-hint"></small></button>
      <button id="snooze">Pause for 30 minutes</button>
    </div>

    <footer>
      <span id="lifetime"></span>
      <a href="#" id="options">Settings</a>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
